name: Auto Create & Upload YouTube Short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Kis topic par video banana hai?'
        required: true
      lang:
        description: 'Language (Hindi ya English)'
        required: true
        default: 'Hindi'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          VIDEO_LANG: ${{ github.event.inputs.lang }}
        run: python auto_video.py
